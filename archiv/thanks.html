<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thanks — BIMfabrik Copilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070913;--bg2:#06080f;
      --card:rgba(255,255,255,.06);--border:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.68);
      --a1:#5f7cff;--a2:#00eaff;
      --headerbg: rgba(7,9,19,.55);
    }
    [data-theme="light"]{
      --bg:#f6f7fb;--bg2:#eef1f8;
      --card:rgba(255,255,255,.78);--border:rgba(10,15,25,.12);
      --text:rgba(10,15,25,.92);--muted:rgba(10,15,25,.68);
      --headerbg: rgba(246,247,251,.72);
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto}
    body{
      min-height:100vh;
      background:
        radial-gradient(900px 500px at 10% 0%, rgba(95,124,255,.20), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(0,234,255,.14), transparent 60%),
        linear-gradient(180deg,var(--bg),var(--bg2));
      color:var(--text);
    }
    .wrap{max-width:980px;margin:0 auto;padding:0 20px}
    header{background:var(--headerbg);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06);}
    [data-theme="light"] header{border-bottom:1px solid rgba(10,15,25,.08);}
    .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
    .brand{display:flex;align-items:center;gap:10px}
    .mark{width:30px;height:30px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));}
    .logo{font-weight:800;letter-spacing:.4px}
    .btn{padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);backdrop-filter:blur(12px);color:var(--text);
      cursor:pointer;text-decoration:none;font-weight:700;font-size:13px;display:inline-flex;gap:8px;align-items:center}
    [data-theme="light"] .btn{background:rgba(255,255,255,.65);border:1px solid rgba(10,15,25,.12);}
    main{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:26px 0}
    .box{max-width:680px;width:100%;padding:28px;border-radius:26px;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(14px)}
    .grad{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    p{margin-top:12px;color:var(--muted);line-height:1.7}
    a.cta{display:inline-block;margin-top:18px;text-decoration:none;color:#061018;background:linear-gradient(90deg,var(--a1),var(--a2));
      padding:12px 14px;border-radius:16px;font-weight:800}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div class="logo">BIMfabrik Copilot</div>
        </div>
        <button class="btn" id="themeToggle" type="button" aria-label="Toggle dark/light"><span id="themeIcon">🌙</span> <span id="themeLabel">Dark</span></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="box">
      <h1 style="font-size:28px;letter-spacing:-.4px;margin:0">You’re on the list <span class="grad">🚀</span></h1>
      <p>Thanks for joining the BIMfabrik Copilot waitlist. We’ll email you product updates, early demos, and pilot invitations.</p>
      <a class="cta" href="/">Back to home</a>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const btn = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");
    const label = document.getElementById("themeLabel");

    function systemPrefersLight(){
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    }
    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      const isLight = theme === "light";
      icon.textContent = isLight ? "☀️" : "🌙";
      label.textContent = isLight ? "Light" : "Dark";
    }
    const saved = localStorage.getItem("theme");
    const initial = saved ? saved : (systemPrefersLight() ? "light" : "dark");
    applyTheme(initial);

    btn.addEventListener("click", () => {
      const current = root.getAttribute("data-theme") || "dark";
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem("theme", next);
      applyTheme(next);
    });
  </script>
</body>
</html>
