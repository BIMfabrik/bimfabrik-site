<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="BIMfabrik baut an der nächsten Version seiner digitalen Datenebene.">
  <meta name="robots" content="noindex, follow">
  <title>BIMfabrik — Im Aufbau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/construction/construction.css?v=eb06c9d">
</head>
<body>
  <main class="construction-shell">
    <div class="grid" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="/construction/" aria-label="BIMfabrik Startseite">
        <span class="brand-mark">BF</span>
        <span><strong>BIMfabrik</strong><small>BIM, Digital Twin & Lifecycle-Daten</small></span>
      </a>
      <span class="build-status"><i></i> SYSTEM UPDATE</span>
    </header>

    <section class="hero" aria-label="Animierte Datenlandschaft">
      <div class="webgl-stage">
        <canvas id="signal-field" aria-hidden="true"></canvas>
      </div>
    </section>

    <section class="join" aria-labelledby="join-title">
      <div>
        <p class="eyebrow"><span></span> FRÜHER ZUGANG</p>
        <h2 id="join-title">Bleiben Sie in der Schleife.</h2>
        <p>Erfahren Sie als Erste, wenn BIMfabrik wieder live ist und wir neue Pilotpartner aufnehmen.</p>
      </div>
      <form action="https://formspree.io/f/xzdanybz" method="POST">
        <label for="email">Geschäftliche E-Mail</label>
        <div class="form-row">
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@firma.ch" required>
          <button type="submit">Auf die Liste</button>
        </div>
        <input type="hidden" name="product" value="BIMfabrik Früher Zugang">
        <input type="hidden" name="_redirect" value="https://bimfabrik.ch/construction/thanks/">
        <input type="hidden" name="_language" value="de">
        <p class="privacy">Nur Updates zu BIMfabrik. Kein Spam.</p>
      </form>
    </section>

    <footer><span>© BIMfabrik</span><a href="/impressum/">Impressum</a></footer>
  </main>
  <script src="/construction/construction.js?v=eb06c9d"></script>
</body>
</html>
