<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks - RealEstateSignal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="thanks">
  <div class="site-shell">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>
    <div class="wrap" style="padding: 96px 0;">
      <section class="waitlist-shell" style="grid-template-columns: 1fr; max-width: 720px; margin: 0 auto;">
        <div class="waitlist-copy">
          <span data-i18n="thankTag">Thank you</span>
          <h2 data-i18n="thankTitle">Your request is in.</h2>
          <p data-i18n="thankText">We received your details and will reach out with early access updates, pilot opportunities, and product progress for RealEstateSignal.</p>
          <div class="hero-actions" style="margin-top: 24px;">
            <a class="button button-primary" href="/" data-i18n="thankButton">Back to homepage</a>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
